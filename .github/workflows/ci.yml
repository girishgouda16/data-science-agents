name: Holdout CI

# Every agent, EDA to MLOps: the five training agents (classification,
# regression, clustering, anomaly, forecasting), everything they hand work to
# (visualization -> MLflow registry -> serving / explain / drift), and the
# orchestrator and gateway that route between them. No LLM is called: every
# suite drives the tools directly. test_production_wangiri.py (3.5M rows,
# ~10 min, data not in git) and eval_agent.py (live LLM, costs money) are run
# by hand — see classification-agent/SKILL.md.

on:
  push:          # any branch: `quick` only (~1 min)
  pull_request:

# A newer push to the same branch/PR cancels the older, now-stale run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Needs no pip install, so it finishes in about a minute.
  quick:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Every .py file parses
        run: python -m compileall -q -x 'node_modules|/dist/|mlruns' .
      - name: Gate engine (stdlib only)
        working-directory: core
        run: python test_gates.py
      - name: UI lint + tests
        working-directory: ui
        run: npm ci && npm run lint && npm test

  # Full suite, disabled: it takes ~10 minutes and core/test_tracing.py needs
  # langfuse and opentelemetry-exporter-otlp, which the install step lacks.
